async function showPaymentSummary() {
  let items = await dbGet('worklog');
  const filterMonth = document.getElementById('wl-filter-month').value;
  const filterDone = document.getElementById('wl-filter-done').value;
  const filterPaid = document.getElementById('wl-filter-paid').value;
  const search = normalize(document.getElementById('wl-search').value || '');

  if (search) {
    items = items.filter(w =>
      normalize(w.customer).includes(search) || normalize(w.model || '').includes(search) ||
      normalize(w.symptom || '').includes(search) || normalize(w.location || '').includes(search)
    );
  }
  if (filterMonth) items = items.filter(w => (w.date || '').startsWith(filterMonth));
  if (filterDone !== 'all') items = items.filter(w => w.done === filterDone);
  if (filterPaid !== 'all') items = items.filter(w => w.paid === filterPaid);

  const paid = items.filter(w => w.payAmount > 0);
  const methods = ['현금', '카드', '계산서', '계좌이체'];
  const colors = { '현금': '#16a34a', '카드': '#2563eb', '계산서': '#9333ea', '계좌이체': '#0891b2' };
  const totalAll = paid.reduce((s, w) => s + (w.payAmount || 0), 0);
  const allPartsCost = paid.reduce((s, w) => s + (w.partsCost || 0), 0);
  const allParts = paid.reduce((s, w) => s + (w.partsAmount || 0), 0);
  const allLabor = paid.reduce((s, w) => s + (w.laborAmount || 0), 0);
  const allVat = paid.reduce((s, w) => s + (w.vat || 0), 0);
  const mPartsMargin = allParts - allPartsCost;
  const mNetProfit = totalAll - allPartsCost;

  let html = `<div class="modal-title">결제 수단별 현황</div>`;
  html += `
    <div style="display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;">
      <div style="flex:1; min-width:120px; text-align:center; padding:12px; background:#f3e8ff; border-radius:8px;">
        <div style="font-size:11px; color:#9333ea; font-weight:600;">부품 원가</div>
        <div style="font-size:20px; font-weight:700; color:#9333ea;">${fmt(allPartsCost)}원</div>
      </div>
      <div style="flex:1; min-width:120px; text-align:center; padding:12px; background:#ede9fe; border-radius:8px;">
        <div style="font-size:11px; color:#7c3aed; font-weight:600;">부품 청구</div>
        <div style="font-size:20px; font-weight:700; color:#7c3aed;">${fmt(allParts)}원</div>
        <div style="font-size:11px; color:${mPartsMargin >= 0 ? '#16a34a' : '#dc2626'};">마진 ${mPartsMargin >= 0 ? '+' : ''}${fmt(mPartsMargin)}원</div>
      </div>
      <div style="flex:1; min-width:120px; text-align:center; padding:12px; background:#ecfeff; border-radius:8px;">
        <div style="font-size:11px; color:#0891b2; font-weight:600;">수리비</div>
        <div style="font-size:20px; font-weight:700; color:#0891b2;">${fmt(allLabor)}원</div>
      </div>
      ${allVat ? `<div style="flex:1; min-width:120px; text-align:center; padding:12px; background:#fff7ed; border-radius:8px;">
        <div style="font-size:11px; color:#e67700; font-weight:600;">부가세</div>
        <div style="font-size:20px; font-weight:700; color:#e67700;">${fmt(allVat)}원</div>
      </div>` : ''}
      <div style="flex:1; min-width:120px; text-align:center; padding:12px; background:#eff6ff; border-radius:8px;">
        <div style="font-size:11px; color:var(--primary); font-weight:600;">청구 합계</div>
        <div style="font-size:20px; font-weight:700; color:var(--primary);">${fmt(totalAll)}원</div>
      </div>
      <div style="flex:1; min-width:120px; text-align:center; padding:12px; background:${mNetProfit >= 0 ? '#f0fdf4' : '#fef2f2'}; border-radius:8px; border:2px solid ${mNetProfit >= 0 ? '#16a34a' : '#dc2626'};">
        <div style="font-size:11px; color:${mNetProfit >= 0 ? '#16a34a' : '#dc2626'}; font-weight:600;">순수익 (청구-원가)</div>
        <div style="font-size:20px; font-weight:700; color:${mNetProfit >= 0 ? '#16a34a' : '#dc2626'};">${fmt(mNetProfit)}원</div>
      </div>
    </div>`;

  methods.forEach(m => {
    const list = paid.filter(w => w.payMethod === m).sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const mTotal = list.reduce((s, w) => s + (w.payAmount || 0), 0);
    if (!list.length) return;

    html += `
      <div style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:${colors[m]}; color:white; border-radius:8px; font-weight:700;">
          <span>${m} (${list.length}건)</span>
          <span>${fmt(mTotal)}원</span>
        </div>
        <table style="width:100%; border-collapse:collapse; margin-top:4px;">
          <thead><tr>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:left;">날짜</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:left;">고객</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:left;">모델</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:right; color:#9333ea;">부품원가</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:right; color:#7c3aed;">부품청구</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:right; color:#0891b2;">수리비</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:right; color:#e67700;">부가세</th>
            <th style="padding:6px 8px; font-size:11px; border-bottom:2px solid var(--border); text-align:right;">청구합계</th>
          </tr></thead>
          <tbody>${list.map(w => `
            <tr>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px;">${w.date}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px;">${w.customer}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px;">${w.model || '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#9333ea;">${w.partsCost ? fmt(w.partsCost) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#7c3aed;">${w.partsAmount ? fmt(w.partsAmount) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#0891b2;">${w.laborAmount ? fmt(w.laborAmount) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#e67700;">${w.vat ? fmt(w.vat) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; font-weight:600;">${fmt(w.payAmount)}원</td>
            </tr>
          `).join('')}</tbody>
        </table>
      </div>`;
  });

  const noMethod = paid.filter(w => !w.payMethod);
  if (noMethod.length) {
    const nmTotal = noMethod.reduce((s, w) => s + (w.payAmount || 0), 0);
    html += `
      <div style="margin-bottom:16px;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#6b7280; color:white; border-radius:8px; font-weight:700;">
          <span>수단 미지정 (${noMethod.length}건)</span>
          <span>${fmt(nmTotal)}원</span>
        </div>
        <table style="width:100%; border-collapse:collapse; margin-top:4px;">
          <tbody>${noMethod.map(w => `
            <tr>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px;">${w.date}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px;">${w.customer}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px;">${w.model || '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#9333ea;">${w.partsCost ? fmt(w.partsCost) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#7c3aed;">${w.partsAmount ? fmt(w.partsAmount) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#0891b2;">${w.laborAmount ? fmt(w.laborAmount) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; color:#e67700;">${w.vat ? fmt(w.vat) : '-'}</td>
              <td style="padding:5px 8px; border-bottom:1px solid var(--border); font-size:13px; text-align:right; font-weight:600;">${fmt(w.payAmount)}원</td>
            </tr>
          `).join('')}</tbody>
        </table>
      </div>`;
  }

  html += `<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">닫기</button></div>`;
  showModal(html);
}

function filterWorklogStat(type) {
  if (type === 'done') {
    const sel = document.getElementById('wl-filter-done');
    sel.value = sel.value === '미완료' ? 'all' : '미완료';
  } else {
    const sel = document.getElementById('wl-filter-paid');
    sel.value = sel.value === '미결제' ? 'all' : '미결제';
  }
  renderWorklog();
}
